name: Create GitHub Release from Tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag in semver format, e.g. v3.2.12
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --tags --force
          git rev-parse "${RELEASE_TAG}" >/dev/null
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build concise release notes
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout "${RELEASE_TAG}"
          python .github/scripts/build_release_notes.py /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          generate_release_notes: false
